name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compile Artifacts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev pkg-config

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Build Core and Loader
      run: cargo build --release --workspace --exclude benchmarks --exclude tests

    - name: Upload Compiled Libraries
      uses: actions/upload-artifact@v4
      with:
        name: ember-compiled-files
        path: |
          target/release/*.so
          target/release/*.dll
          target/release/horizon-client
        if-no-files-found: warn
